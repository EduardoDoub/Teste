name: helloworld
description: Gestor Financeiro DOUB.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  firebase_core: any
  cloud_firestore: any
  shared_preferences: any 
  flutter_localizations:
    sdk: flutter
  snow_fall_animation: ^0.0.1
  universal_html: ^2.3.0
  upgrader: ^13.7.0
  upgrade: ^0.0.8
  local_auth: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/imagens/
    # - imagens/eduardo.png
    # - imagens/naiub.png
  # Cole esta parte logo abaixo do uses-material-design:
  fonts:
    - family: TabPearl
      fonts:
        - asset: assets/fonts/tan-pearl.otf
  